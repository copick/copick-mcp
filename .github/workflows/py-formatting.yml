name: Python Linting

on:
  pull_request:
  push:
    branches: [main, v2.0]

jobs:
  pre_commit_checks:
    name: pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: check linting
        uses: pre-commit/action@v3.0.1
